#app{max-width:480px;margin:0 auto;height:100vh;position:relative;overflow:hidden}
#content{height:100%;overflow-y:auto;padding-bottom:80px}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;

.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;

.nav-btn.active{color:#E53E3E}

/* Carousel */
.carousel{position:relative;height:470px;width:100%;perspective:1200px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
.carousel-card{position:absolute;left:50%;top:10px;width:260px;height:400px;margin-left:-130px;

.carousel-card img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.card-gradient{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.95))}
.badge-star{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);
  border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:5px}
.badge-star span{color:#FBBF24;font-size:14px;font-weight:800}
.badge-imdb{position:absolute;top:14px;right:14px;background:linear-gradient(135deg,#E53E3E,#B91C1C);
  border-radius:10px;padding:5px 10px}
.badge-imdb span{color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px}
.card-title{position:absolute;bottom:0;left:0;right:0;padding:16px 16px 18px}
.card-title h3{font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);line-height:1.2;margin:0}
.card-title p{color:rgba(255,255,255,.55);font-size:12px;margin-top:5px;font-weight:500}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:20}
.dot{height:6px;border-radius:3px;cursor:pointer;transition:all .3s}

/* HRow */
.hrow{display:flex;gap:14px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x mandatory}
.hrow-card{min-width:145px;width:145px;scroll-snap-align:start;cursor:pointer}
.hrow-card .poster{width:145px;height:218px;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4);position:relative}
.hrow-card .poster img{width:100%;height:100%;object-fit:cover;display:block}
.hrow-card .name{color:#ccc;font-size:12px;font-weight:600;margin-top:8px;line-height:1.3}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:100;background:#0b0b1a;overflow-y:auto;animation:detailIn .45s cubic-bezier(.22,1,.36,1)}
.overlay-admin{z-index:200}

/* Genre grid */
.genre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 24px}

input[type=text],input[type=search],.cinput{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);

.btn-red{padding:10px 18px;border-radius:12px;border:none;background:#E53E3E;color:#fff;cursor:pointer;font-weight:800;font-size:16px;font-family:inherit}
</style>

/* ══════ CAROUSEL ══════ */
function buildCarousel(movies,cid){
  if(!carouselStates[cid])carouselStates[cid]={idx:0};
  const st=carouselStates[cid];
  let h=`<div class="carousel" id="car-${cid}" data-cid="${cid}">`;
  movies.forEach((m,i)=>{
    const diff=i-st.idx,absD=Math.abs(diff);
    if(absD>3)return;
    const tx=diff*195,tz=absD===0?60:-80*absD,ry=diff*-15;
    const sc=absD===0?1.05:Math.max(.6,1-absD*.2);
    const op=absD>2?0:absD===0?1:.55;
    const zi=10-absD,bl=absD===0?0:absD*2;
    const poster=m.poster_path?`${IMG}/w500${m.poster_path}`:'';
    const shadow=absD===0?'0 24px 60px rgba(0,0,0,.9),0 0 50px rgba(229,62,62,.12)':'0 10px 30px rgba(0,0,0,.5)';

    h+=`<div class="carousel-card" onclick="carClick('${cid}',${i},${m.id})"
      style="transform:translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${sc});
      opacity:${op};z-index:${zi};filter:${bl>0?`blur(${bl}px)`:'none'};box-shadow:${shadow}">`;
    if(poster)h+=`<img src="${poster}" onerror="this.style.display='none'" alt="">`;
    else h+=`<div style="width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:40px">🎬</div>`;
    h+=`<div class="card-gradient"></div>`;
    if(absD===0){
      h+=`<div class="badge-star">${STAR_SVG}<span>${m.vote_average.toFixed(1)}</span></div>`;
      h+=`<div class="badge-imdb"><span>IMDB ${m.vote_average.toFixed(1)}</span></div>`;
    }
    h+=`<div class="card-title"><h3>${m.title}</h3>`;
    if(absD===0&&m.release_date)h+=`<p>${m.release_date.slice(0,4)} • ${(m.genre_ids||[]).slice(0,2).map(g=>GENRES_MAP[g]).filter(Boolean).join(', ')}</p>`;
    h+=`</div></div>`;
  });
  // dots
  h+=`<div class="dots">`;
  const cnt=Math.min(movies.length,15);
  for(let i=0;i<cnt;i++){
    h+=`<div class="dot" onclick="carGo('${cid}',${i},true)" style="width:${i===st.idx?'22px':'6px'};background:${i===st.idx?'#E53E3E':'rgba(255,255,255,.2)'}"></div>`;
  }
  h+=`</div></div>`;
  return h;
}

function carClick(cid,i,mid){
  const st=carouselStates[cid];
  if(i===st.idx){openDetail(ALL_MOVIES.find(m=>m.id===mid)||MOVIES.trending[0]);}
  else{carGo(cid,i,true);}
}
function carGo(cid,idx,abs){
  const st=carouselStates[cid];
  if(abs)st.idx=idx;else st.idx=Math.max(0,Math.min(999,st.idx+idx));
  renderContent();
}

// Touch/mouse swipe for carousels
let touchCid=null,touchX=0;
document.addEventListener('touchstart',e=>{
  const car=e.target.closest('.carousel');
  if(!car)return;touchCid=car.dataset.cid;touchX=e.touches[0].clientX;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!touchCid)return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>35){const st=carouselStates[touchCid];const movies=getCarouselMovies(touchCid);
    st.idx=Math.max(0,Math.min(movies.length-1,st.idx+(dx<0?1:-1)));renderContent();}
  touchCid=null;
},{passive:true});
let mouseCid=null,mouseX=0,mouseDown=false;
document.addEventListener('mousedown',e=>{
  const car=e.target.closest('.carousel');
  if(!car)return;mouseCid=car.dataset.cid;mouseX=e.clientX;mouseDown=true;
});
document.addEventListener('mouseup',e=>{
  if(!mouseDown||!mouseCid)return;mouseDown=false;
  const dx=e.clientX-mouseX;
  if(Math.abs(dx)>35){const st=carouselStates[mouseCid];const movies=getCarouselMovies(mouseCid);
    st.idx=Math.max(0,Math.min(movies.length-1,st.idx+(dx<0?1:-1)));renderContent();}
  mouseCid=null;
});

function getCarouselMovies(cid){
  if(cid==='trending')return MOVIES.trending;
  if(cid==='genre')return ALL_MOVIES.filter(m=>(m.genre_ids||[]).includes(parseInt(cid.split('-')[1]||0)));
  if(cid.startsWith('genre-'))return ALL_MOVIES.filter(m=>(m.genre_ids||[]).includes(parseInt(cid.split('-')[1])));
  if(cid.startsWith('col-')){const col=collections.find(c=>c.id===parseInt(cid.split('-')[1]));return col?col.movies:[];}
  return MOVIES.trending;
}

}

let randomMovie=null,randomSpin=false;
function renderRandom(el){
  let h=`<div style="padding:24px 0 100px;display:flex;flex-direction:column;align-items:center;min-height:80vh">
    <h1 style="font-size:28px;font-weight:900;margin-bottom:6px">Рандом 🎲</h1>
    <p style="color:#444;font-size:14px;margin-bottom:40px">Не знаешь что смотреть?</p>
    <button onclick="rollRandom()" style="width:110px;height:110px;border-radius:55px;border:none;
      background:linear-gradient(135deg,#E53E3E,#B91C1C);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
      box-shadow:0 12px 40px rgba(229,62,62,.4),0 0 60px rgba(229,62,62,.15);
      animation:${randomSpin?'spinBtn .8s ease infinite':'pulse 2s ease infinite'}">
      <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </button>
    <p style="color:#555;font-size:12px;margin-top:14px">Нажми!</p>`;
  if(randomMovie&&!randomSpin){
    const m=randomMovie;
    h+=`<div onclick='openDetail(${JSON.stringify(m).replace(/'/g,"&#39;")})' style="margin-top:32px;width:270px;border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:0 16px 50px rgba(0,0,0,.7);animation:cardPop .5s cubic-bezier(.22,1,.36,1)">
      ${m.poster_path?`<img src="${IMG}/w500${m.poster_path}" style="width:100%;display:block" onerror="this.style.display='none'">`:''}
      <div style="padding:14px 16px 18px;background:rgba(255,255,255,.03)">
        <div style="font-size:17px;font-weight:800;margin-bottom:6px">${m.title}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
          ${STAR_SVG}<span style="color:#FBBF24;font-weight:700;font-size:14px">${m.vote_average.toFixed(1)}</span>
          <span style="color:#555;font-size:13px">${m.release_date?.slice(0,4)||''}</span>
        </div>
        <p style="color:#777;font-size:12px;line-height:1.5;margin:0">${(m.overview||'').slice(0,100)}…</p>
      </div></div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}
function rollRandom(){
  randomSpin=true;randomMovie=null;renderContent();
  setTimeout(()=>{randomMovie=ALL_MOVIES[Math.floor(Math.random()*ALL_MOVIES.length)];randomSpin=false;renderContent();},900);
}

/* ══════ ADMIN ══════ */
let adminActive=null,adminQ='';
function showAdmin(){
  adminActive=null;adminQ='';renderAdmin();
}
function closeAdmin(){document.getElementById('admin-overlay').innerHTML='';}
function renderAdmin(){
  let h=`<div class="overlay overlay-admin">
    <div style="padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;background:#0b0b1a;z-index:10">
      <h2 style="font-size:20px;font-weight:800;margin:0">⚙️ Админ</h2>
      <button onclick="closeAdmin()" style="background:rgba(255,255,255,.06);border:none;border-radius:12px;width:38px;height:38px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="padding:20px">
      <h3 style="color:#888;font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Новая коллекция</h3>
      <div style="display:flex;gap:8px;margin-bottom:24px">
        <input type="text" id="adm-emoji" value="🎬" style="width:50px;text-align:center;font-size:20px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;outline:none">
        <input type="text" id="adm-name" placeholder="Название…" style="flex:1;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;font-family:inherit">
        <button onclick="addCol()" class="btn-red">+</button>
      </div>`;

  collections.forEach(c=>{
    const isActive=adminActive===c.id;
    h+=`<div style="background:${isActive?'rgba(229,62,62,.08)':'rgba(255,255,255,.02)'};border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;border:1px solid ${isActive?'rgba(229,62,62,.25)':'rgba(255,255,255,.04)'}" onclick="toggleAdmCol(${c.id})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700">${c.emoji} ${c.name} <span style="color:#444;font-weight:400">(${c.movies.length})</span></span>
        <button onclick="event.stopPropagation();delCol(${c.id})" style="background:none;border:none;color:#E53E3E;cursor:pointer;font-size:16px">🗑️</button>
      </div>`;
    if(isActive&&c.movies.length){
      c.movies.forEach(m=>{
        h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:8px;background:rgba(255,255,255,.03);border-radius:10px;padding:8px">
          ${m.poster_path?`<img src="${IMG}/w92${m.poster_path}" style="width:36px;height:54px;border-radius:8px;object-fit:cover">`:''}
          <span style="color:#bbb;font-size:13px;flex:1">${m.title}</span>
          <button onclick="event.stopPropagation();rmFromCol(${c.id},${m.id})" style="background:none;border:none;color:#666;cursor:pointer">✕</button>
        </div>`;
      });
    }
    h+=`</div>`;
  });

  if(adminActive!==null){
    const col=collections.find(c=>c.id===adminActive);
    if(col){
      h+=`<div style="margin-top:20px">
        <h3 style="color:#888;font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Добавить в «${col.name}»</h3>
        <input type="text" id="adm-search" placeholder="Поиск по названию…" oninput="adminSearch(this.value)"
          value="${adminQ}" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box;font-family:inherit">`;
      if(adminQ.trim()){
        const filtered=ALL_MOVIES.filter(m=>m.title.toLowerCase().includes(adminQ.toLowerCase()));
        filtered.forEach(m=>{
          const inC=col.movies.find(x=>x.id===m.id);
          h+=`<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border-radius:12px;padding:10px;margin-bottom:8px">
            ${m.poster_path?`<img src="${IMG}/w92${m.poster_path}" style="width:40px;height:60px;border-radius:8px;object-fit:cover">`:''}
            <div style="flex:1"><div style="font-size:14px;font-weight:600">${m.title}</div><div style="color:#444;font-size:12px">${m.release_date?.slice(0,4)||''}</div></div>
            <button onclick="addToCol(${m.id})" ${inC?'disabled':''} style="padding:8px 14px;border-radius:10px;border:none;background:${inC?'#222':'#E53E3E'};color:${inC?'#555':'#fff'};cursor:${inC?'default':'pointer'};font-size:12px;font-weight:700;font-family:inherit">${inC?'✓':'+ Добавить'}</button>
          </div>`;
        });
      }
      h+=`</div>`;
    }
  }
  h+=`</div></div>`;
  document.getElementById('admin-overlay').innerHTML=h;
}

function addCol(){
  const name=document.getElementById('adm-name').value.trim();
  const emoji=document.getElementById('adm-emoji').value.trim()||'🎬';
  if(!name)return;
  collections.push({id:Date.now(),name,emoji,movies:[]});saveCols();
  adminActive=collections[collections.length-1].id;renderAdmin();
}
function delCol(id){collections=collections.filter(c=>c.id!==id);saveCols();if(adminActive===id)adminActive=null;renderAdmin();renderContent();}
function toggleAdmCol(id){adminActive=adminActive===id?null:id;adminQ='';renderAdmin();}
function adminSearch(v){adminQ=v;renderAdmin();setTimeout(()=>{const el=document.getElementById('adm-search');if(el){el.focus();el.setSelectionRange(v.length,v.length);}},10);}
function addToCol(mid){
  const m=ALL_MOVIES.find(x=>x.id===mid);if(!m||adminActive===null)return;
  const col=collections.find(c=>c.id===adminActive);if(!col||col.movies.find(x=>x.id===mid))return;
  col.movies.push(m);saveCols();renderAdmin();renderContent();
}
function rmFromCol(cid,mid){
  const col=collections.find(c=>c.id===cid);if(!col)return;
  col.movies=col.movies.filter(x=>x.id!==mid);saveCols();renderAdmin();renderContent();
}

/* ══════ INIT ══════ */
renderNav();renderContent();
</script>
</body>
</html>
